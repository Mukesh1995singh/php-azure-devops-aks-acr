apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: php-keyvault-secrets
  namespace: php-app
spec:
  # Azure Key Vault CSI Provider
  provider: azure

  # =====================================================
  # Sync Key Vault Secrets -> Kubernetes Secret
  # Used by Deployment secretKeyRef
  # =====================================================
  secretObjects:
    - secretName: php-secrets
      type: Opaque
      data:
        - objectName: db-host
          key: db-host
        - objectName: db-name
          key: db-name
        - objectName: db-username
          key: db-username
        - objectName: db-password
          key: db-password

  # =====================================================
  # Azure Workload Identity Authentication
  # =====================================================
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"

    # User Assigned Managed Identity Client ID
    # From Bicep output: phpManagedIdentityClientId
    clientID: "<PHP_MANAGED_IDENTITY_CLIENT_ID>"

    # Azure Key Vault Details
    keyvaultName: "<KEYVAULT_NAME>"
    tenantId: "<AZURE_TENANT_ID>"

    # =====================================================
    # Azure Key Vault Secrets
    # =====================================================
    objects: |
      array:
        - |
          objectName: db-host
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-name
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-username
          objectType: secret
          objectVersion: ""
        - |
          objectName: db-password
          objectType: secret
          objectVersion: ""