apiVersion: apps/v1
kind: Deployment

metadata:
  name: php-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: php-app

  template:
    metadata:
      labels:
        app: php-app

    spec:
      containers:
      - name: php-app
        image: youracrname.azurecr.io/php-app:v1
        ports:
        - containerPort: 80