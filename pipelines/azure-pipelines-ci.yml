# ============================================================
# Azure DevOps CI Pipeline
# Project : PHP Application
# Purpose : Build Docker Image, Push Image to ACR, 
#           and Publish Kubernetes Manifests
# ============================================================

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  dockerRegistryServiceConnection: 'myacr73010'
  containerRegistry: 'myacr73010.azurecr.io'
  imageRepository: 'phpproject'
  dockerfilePath: '$(Build.SourcesDirectory)/Dockerfile'
  imageTag: '$(Build.BuildId)'
  latestTag: 'latest'

stages:
- stage: CI
  displayName: 'Continuous Integration'
  jobs:
  - job: Build
    displayName: 'Build and Push Image'
    steps:

    - checkout: self
      clean: true
      displayName: 'Checkout Source Code'

    - script: |
        echo "Docker Version"
        docker --version
      displayName: 'Verify Docker Installation'

    # Note: You can technically remove this login step entirely. 
    # The buildAndPush task below handles login automatically.
    - task: Docker@2
      displayName: 'Login to Azure Container Registry'
      inputs:
        command: login
        containerRegistry: $(dockerRegistryServiceConnection)

    - task: Docker@2
      displayName: 'Build and Push Docker Image'
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(imageTag)
          $(latestTag)

    # Publish Kubernetes Manifests
    - task: PublishBuildArtifacts@1
      displayName: 'Publish Kubernetes Manifests'
      inputs:
        PathtoPublish: '$(Build.SourcesDirectory)/kubernetes'
        ArtifactName: 'kubernetes-manifests'

    - script: |
        echo "======================================"
        echo "CI Pipeline Completed Successfully"
        echo "======================================"
        echo "Container Registry : $(containerRegistry)"
        echo "Repository         : $(imageRepository)"
        echo "Image Tag          : $(imageTag)"
      displayName: 'Build Summary'