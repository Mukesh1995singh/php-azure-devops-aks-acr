trigger:
  - main

pr:
  branches:
    include:
      - main

variables:
  # Docker Image & ACR Details
  imageRepository: 'php-app'
  dockerfilePath: 'Dockerfile'
  containerRegistry: 'acr-service-connection' # Azure DevOps Docker Registry Service Connection
  imageTag: '$(Build.BuildId)'

  # Azure & AKS Deployment Variables
  azureSubscription: 'azure-resource-manager-service-connection'
  aksResourceGroup: 'rg-php-prod'
  aksClusterName: 'aks-php-prod'
  k8sNamespace: 'php-app'

  # Key Vault & Managed Identity Variables (Populate or pass from Pipeline Library Group)
  phpManagedIdentityClientId: '$(PHP_MANAGED_IDENTITY_CLIENT_ID)'
  keyVaultName: '$(KEYVAULT_NAME)'
  tenantId: '$(AZURE_TENANT_ID)'

stages:

# =====================================================
# Stage 1: Build and Push Docker Image & Package Manifests
# =====================================================
- stage: Build
  displayName: Build and Package

  jobs:
    - job: BuildAndPush
      displayName: Docker Build & Manifest Packaging
      pool:
        vmImage: ubuntu-latest

      steps:
        - checkout: self
          displayName: Checkout Repository

        # ---------------------------------------
        # Build Docker Image and Push to ACR
        # ---------------------------------------
        - task: Docker@2
          displayName: Build and Push Docker Image
          inputs:
            command: buildAndPush
            containerRegistry: $(containerRegistry)
            repository: $(imageRepository)
            dockerfile: $(dockerfilePath)
            tags: |
              $(imageTag)
              latest

        # ---------------------------------------
        # Replace Placeholders in Manifests
        # ---------------------------------------
        - task: Bash@3
          displayName: Replace Tokenized Values in K8s Manifests
          inputs:
            targetType: inline
            script: |
              echo "Replacing tokenized variables in kubernetes/ folder..."
              sed -i "s|<PHP_MANAGED_IDENTITY_CLIENT_ID>|$(phpManagedIdentityClientId)|g" kubernetes/secretproviderclass.yaml
              sed -i "s|<KEYVAULT_NAME>|$(keyVaultName)|g" kubernetes/secretproviderclass.yaml
              sed -i "s|<AZURE_TENANT_ID>|$(tenantId)|g" kubernetes/secretproviderclass.yaml
              sed -i "s|\$(imageTag)|$(imageTag)|g" kubernetes/deployment.yaml

        # ---------------------------------------
        # Create Image Tag Artifact
        # ---------------------------------------
        - task: Bash@3
          displayName: Generate Image Tag File
          inputs:
            targetType: inline
            script: |
              echo "$(imageTag)" > image-tag.txt
              cat image-tag.txt

        - task: PublishPipelineArtifact@1
          displayName: Publish Docker Image Tag
          inputs:
            targetPath: image-tag.txt
            artifact: image-tag

        # ---------------------------------------
        # Publish Processed Kubernetes Manifests
        # ---------------------------------------
        - task: PublishPipelineArtifact@1
          displayName: Publish Kubernetes Manifests
          inputs:
            targetPath: kubernetes
            artifact: manifests

# =====================================================
# Stage 2: Deploy to Azure Kubernetes Service (AKS)
# =====================================================
- stage: Deploy
  displayName: Deploy to AKS
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
    - deployment: DeployToAKS
      displayName: Apply Manifests to AKS
      pool:
        vmImage: ubuntu-latest
      environment: 'production.php-app'
      strategy:
        runOnce:
          deploy:
            steps:
              - download: current
                artifact: manifests
                displayName: Download Kubernetes Manifests

              # ---------------------------------------
              # Deploy Manifests using Azure CLI / kubectl
              # ---------------------------------------
              - task: AzureCLI@2
                displayName: Deploy Kubernetes Manifests to AKS
                inputs:
                  azureSubscription: $(azureSubscription)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    # Get AKS credentials
                    az aks get-credentials \
                      --resource-group $(aksResourceGroup) \
                      --name $(aksClusterName) \
                      --overwrite-existing

                    MANIFEST_DIR="$(Pipeline.Workspace)/manifests"

                    echo "Applying manifests from ${MANIFEST_DIR}..."
                    kubectl apply -f ${MANIFEST_DIR}/namespace.yaml
                    kubectl apply -f ${MANIFEST_DIR}/configmap.yaml
                    kubectl apply -f ${MANIFEST_DIR}/serviceaccount.yaml
                    kubectl apply -f ${MANIFEST_DIR}/secretproviderclass.yaml
                    kubectl apply -f ${MANIFEST_DIR}/deployment.yaml
                    kubectl apply -f ${MANIFEST_DIR}/service.yaml

                    echo "Checking rollout status..."
                    kubectl rollout status deployment/php-app -n $(k8sNamespace) --timeout=180s